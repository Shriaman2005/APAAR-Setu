# Render Blueprint for the APAAR Setu demo (see docs/DEPLOYMENT.md).
# One web service runs Express, which serves both the API and the built React app on one HTTPS URL.
# The database is a MongoDB Atlas cluster (a replica set, so certification transactions work).
services:
  - type: web
    name: apaar-setu
    runtime: node
    plan: free
    region: singapore
    # Vite (the client build tool) is a dev dependency, and NODE_ENV=production makes npm skip
    # dev dependencies, so the client install asks for them explicitly. The server needs none.
    buildCommand: npm --prefix server ci --omit=dev && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render terminates HTTPS in front of the app. Without this, secure session cookies are
      # never set and sign-in fails.
      - key: TRUST_PROXY
        value: "1"
      # "Quick demo access" on the sign-in page: one click signs in to a seeded demo account.
      # For the public prototype demo only; set to "false" to require passwords.
      - key: DEMO_LOGIN
        value: "true"
      # Asked for when the Blueprint is created: the Atlas connection string (never commit it).
      - key: MONGODB_URI
        sync: false
      # Random values generated by Render.
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_REF_SECRET
        generateValue: true
      # CLIENT_ORIGIN and PUBLIC_VERIFY_BASE_URL are not needed: the server uses the
      # RENDER_EXTERNAL_URL that Render provides.
